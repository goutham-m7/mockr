name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # macOS runs are cancelled before starting on this account; the macOS
    # sandbox path is verified locally (see README "Verification").
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node --check src/mockr_coach/static/app.js
      - run: uv run pytest --cov=mockr_coach --cov-report=term-missing
      - run: uv run mockr demo
      - run: uv run mockr calibrate
      - run: uv build
